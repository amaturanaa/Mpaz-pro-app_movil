server:
  port: 9090

spring:
  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: esta_es_mi_compleja_clave_secreta

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:9094
          predicates:
            - Path=/auth/**

        - id: contenidos-service
          uri: http://contenidos-service:9096
          predicates:
            - Path=/asignaturas/**,/unidades/**,/objetivos/**,/contenidos/**

        - id: actividades-service
          uri: http://actividades-service:9097
          predicates:
            - Path=/desafios/**,/pruebas/**,/preguntas/**

        - id: progreso-service
          uri: http://progreso-service:9098
          predicates:
            - Path=/asignaciones/**,/progreso/**,/informes/**,/observaciones/**,/intentos/**

        - id: admin-service
          uri: http://admin-service:9099
          predicates:
            - Path=/admin/**
