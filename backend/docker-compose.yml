# Ejecutar: docker compose up -d
# Antes hay que generar los .jar de cada servicio (ver pasos).
#
# Los servicios usan el MySQL de este mismo compose (servicio "mysql"),
# así que no chocan con ningún MySQL que ya tengas instalado en tu PC.

x-common-env: &common-env
  SECRET: "esta_es_mi_compleja_clave_secreta"

services:

  mysql:
    image: mysql:8.4
    container_name: mysql-microservicios
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api-gateway:
    build: ./api-gateway
    ports:
      - "9090:9090"
    environment:
      <<: *common-env
    restart: on-failure
    depends_on:
      - auth-service
      - producto-service

  auth-service:
    build: ./auth-service
    ports:
      - "9094:9094"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bd_users?createDatabaseIfNotExist=true"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  producto-service:
    build: ./producto-service
    ports:
      - "9093:9093"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bd_producto?createDatabaseIfNotExist=true"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  cliente-service:
    build: ./cliente-service
    ports:
      - "9091:9091"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bd_cliente?createDatabaseIfNotExist=true"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  compra-service:
    build: ./compra-service
    ports:
      - "9092:9092"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bd_compra?createDatabaseIfNotExist=true"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

  pago-service:
    build: ./pago-service
    ports:
      - "9095:9095"
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/bd_pago?createDatabaseIfNotExist=true"
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: